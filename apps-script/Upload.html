<!doctype html><html><head><base target="_top"><style>body{font-family:Arial,sans-serif;background:#f5f8f4;color:#174f35;margin:0;padding:18px}.card{max-width:520px;margin:0 auto;background:white;border-radius:16px;padding:24px;box-shadow:0 5px 24px #1232}h2{margin-top:0}input{display:block;margin:18px 0;width:100%}button{background:#176d46;color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:bold}button:disabled{opacity:.5}img{max-width:100%;max-height:300px;border-radius:10px}small{color:#637568}.status{margin-top:15px}</style></head><body><div class="card"><h2>🌳 CNMI Tree · เพิ่มภาพถ่าย</h2><p>Tree_UID: <b id="uid"><?= uid ?></b></p><p>เลือกภาพจากกล้องหรือคลังภาพ (ไม่เกิน 6 MB)</p><input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" id="photo"><img id="preview" style="display:none"><p><button id="send" disabled>บันทึกภาพลง Google Drive</button></p><small>สำหรับเจ้าหน้าที่ที่ได้รับสิทธิ์เท่านั้น · ภาพยังไม่เผยแพร่สาธารณะ</small><p class="status" id="status"></p></div><script>const uid=document.getElementById('uid').textContent.trim();const input=document.getElementById('photo'),btn=document.getElementById('send'),status=document.getElementById('status'),img=document.getElementById('preview');input.onchange=()=>{const f=input.files[0];btn.disabled=!f;if(f){img.src=URL.createObjectURL(f);img.style.display='block'}};btn.onclick=()=>{const f=input.files[0];if(!f)return;if(f.size>6*1024*1024){status.textContent='ภาพใหญ่เกิน 6 MB';return}btn.disabled=true;status.textContent='กำลังบันทึกภาพ...';const reader=new FileReader();reader.onload=()=>google.script.run.withSuccessHandler(r=>{status.textContent='บันทึกสำเร็จ: '+r.name;btn.disabled=false}).withFailureHandler(e=>{status.textContent='บันทึกไม่สำเร็จ: '+e.message;btn.disabled=false}).savePhoto({tree_uid:uid,mime:f.type,base64:String(reader.result).split(',')[1]});reader.readAsDataURL(f)}</script></body></html>
